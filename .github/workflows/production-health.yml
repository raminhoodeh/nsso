name: nsso production health
on:
  deployment_status:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
jobs:
  health:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.creator.id == 35613825 &&
       github.event.deployment_status.creator.id == 35613825)
    concurrency:
      group: nsso-production-health
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Two 100-second smoke passes plus bounded metadata lookups and setup.
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/security/monitor-production.mjs
